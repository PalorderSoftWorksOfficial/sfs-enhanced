name: Mod Build

on:
  push:
    branches: [main]
    paths:
      - "Mod/**"
      - "Shared/**"
      - "Dependencies/**"
      - "nuget.config"
      - ".github/workflows/mod-build.yml"
  pull_request:
    paths:
      - "Mod/**"
      - "Shared/**"
      - "Dependencies/**"
      - "nuget.config"
      - ".github/workflows/mod-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Mod/SFSEnhanced.Mod.csproj --configfile nuget.config
      - name: Build
        run: dotnet build Mod/SFSEnhanced.Mod.csproj -c Release --no-restore
      - name: Package
        run: |
          mkdir -p dist/SFSEnhanced
          cp Mod/bin/Release/net472/SFSEnhanced.dll dist/SFSEnhanced/SFSEnhanced.dll
          cp Mod/bin/Release/net472/mod.json dist/SFSEnhanced/mod.json
      - uses: actions/upload-artifact@v4
        with:
          name: sfs-enhanced-mod
          path: dist/SFSEnhanced
