name: Server Cross-Platform

on:
  push:
    branches: [main]
    paths:
      - "Server/**"
      - "Shared/**"
      - "TestClient/**"
      - "scripts/fac-smoke-test.*"
      - "scripts/multiplayer-integration/**"
      - ".github/workflows/server-cross-platform.yml"
  pull_request:
    paths:
      - "Server/**"
      - "Shared/**"
      - "TestClient/**"
      - "scripts/fac-smoke-test.*"
      - "scripts/multiplayer-integration/**"
      - ".github/workflows/server-cross-platform.yml"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Server/SFSEnhanced.Server.csproj
      - name: Build
        run: dotnet build Server/SFSEnhanced.Server.csproj -c Release --no-restore
      - name: Publish
        run: dotnet publish Server/SFSEnhanced.Server.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/server-${{ matrix.rid }}
      - name: Smoke test Linux
        if: runner.os == 'Linux'
        run: ./scripts/fac-smoke-test.sh
      - name: Smoke test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fac-smoke-test.ps1
      - name: Multiplayer integration Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          dotnet restore scripts/multiplayer-integration/MultiplayerIntegration.csproj
          dotnet build scripts/multiplayer-integration/MultiplayerIntegration.csproj -c Release --no-restore
          dotnet run --project Server/SFSEnhanced.Server.csproj -c Release --no-build -- --port 18777 --data "$RUNNER_TEMP/sfs-enhanced-integration" --name "Integration Server" > "$RUNNER_TEMP/sfs-enhanced-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in {1..100}; do
            if (echo > /dev/tcp/127.0.0.1/18777) 2>/dev/null; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/sfs-enhanced-server.log"
              exit 1
            fi
            sleep 0.1
          done
          dotnet run --project scripts/multiplayer-integration/MultiplayerIntegration.csproj -c Release --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.rid }}
          path: artifacts/server-${{ matrix.rid }}
